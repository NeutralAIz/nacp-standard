# .github/workflows/train-gate.yml — must be on the base branch before the controller is enabled.
# The controller dispatches this on the trusted base_branch ref and polls the run; it checks out the
# immutable candidate SHA it is given. No secrets. See release-train PROPOSAL 3.7.
name: train-gate
on:
  workflow_dispatch:
    inputs:
      sha:        {required: true, type: string}
      request_id: {required: true, type: string}
      level:      {required: true, type: choice, options: [fast, full]}
run-name: train-gate ${{ inputs.level }} ${{ inputs.sha }} ${{ inputs.request_id }}
permissions: {contents: read}
jobs:
  conformance:
    runs-on: eks-runners
    timeout-minutes: 5
    strategy: {matrix: {python: ['3.10']}}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {ref: '${{ inputs.sha }}', persist-credentials: false}
      - name: source-SHA proof
        env: {SHA: '${{ inputs.sha }}'}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      # >>> TRAIN-TEST-STEPS (replace with the repo's existing test steps, unchanged; `inputs.level` is available for `if:`)
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema ed25519
      - name: Run conformance tests
        run: pytest conformance/
      # <<< TRAIN-TEST-STEPS
