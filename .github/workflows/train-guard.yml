# .github/workflows/train-guard.yml — closes any PR into the base branch or release/next that is not
# the release-train PR. See release-train PROPOSAL 3.8.
#
# pull_request_target runs with the BASE branch's workflow and a write-capable GITHUB_TOKEN, so this
# job has no checkout, no custom secrets, a pinned action, and only parses the event JSON. The script
# below is generated from templates/guard-logic.mjs (node templates/sync-guard.mjs); do not hand-edit
# between the markers. TRAIN_EXEMPTIONS is the maintainer-controlled exemption grant list (JSON, keyed by
# repo, PR and label); an exempt label with no matching grant does not exempt anything.
name: train-guard
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: train-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: eks-runners
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v8.0.0
        env:
          TRAIN_BASE_BRANCH: main
          TRAIN_BOT_LOGIN: neutralaiz-train[bot]
          TRAIN_EXEMPTIONS: '[]'
        with:
          script: |
            // >>> BEGIN guard-logic
            const EXEMPT_LABELS = ['train-exempt:dependabot', 'train-exempt:security'];
            const HANDLED_ACTIONS = ['opened', 'reopened', 'edited', 'synchronize'];
            const RELEASE_NEXT = 'release/next';

            // Only echo branch names that are boring; anything else is replaced, so a hostile name cannot
            // inject markup, mentions or links into the comment.
            function safeRef(name) {
              return typeof name === 'string' && /^[A-Za-z0-9][A-Za-z0-9._\/-]{0,99}$/.test(name) ? name : null;
            }

            function sameRepo(a, b) {
              if (!a || !b) return false;
              if (typeof a.id === 'number' && typeof b.id === 'number') return a.id === b.id;
              return typeof a.full_name === 'string' && a.full_name === b.full_name;
            }

            // Maintainer-granted exemptions. A label alone proves nothing (anyone with triage can apply one), so an
            // exemption needs BOTH the label on the PR and a grant in the trusted guard configuration (TRAIN_EXEMPTIONS,
            // a JSON list in the base-branch workflow, which only maintainers can change) keyed by repo, PR and label.
            // Anything malformed grants nothing.
            function parseGrants(raw) {
              let list = raw;
              if (typeof raw === 'string') {
                try {
                  list = JSON.parse(raw);
                } catch {
                  return [];
                }
              }
              if (!Array.isArray(list)) return [];
              return list
                .filter(
                  (g) =>
                    g &&
                    typeof g === 'object' &&
                    typeof g.repo === 'string' &&
                    Number.isInteger(g.pr) &&
                    typeof g.label === 'string' &&
                    EXEMPT_LABELS.includes(g.label),
                )
                .map((g) => ({ repo: g.repo, pr: g.pr, label: g.label }));
            }

            function isExempt(pr, labels, grants) {
              const repo = pr.base && pr.base.repo && typeof pr.base.repo.full_name === 'string' ? pr.base.repo.full_name : null;
              if (repo === null || !Number.isInteger(pr.number)) return false;
              return grants.some((g) => g.repo === repo && g.pr === pr.number && labels.includes(g.label));
            }

            function decideGuard(payload, cfg) {
              const ignore = (reason) => ({ action: 'ignore', reason });
              const pr = payload && typeof payload === 'object' ? payload.pull_request : null;
              if (!pr || typeof pr !== 'object' || !pr.base || !pr.head) return ignore('malformed');
              if (!HANDLED_ACTIONS.includes(payload.action)) return ignore('unhandled-action');
              if (pr.state !== 'open') return ignore('not-open');

              const baseRef = pr.base.ref;
              const protectedBase = baseRef === cfg.baseBranch || baseRef === RELEASE_NEXT;
              if (!protectedBase) return ignore('unprotected-base');

              const labels = Array.isArray(pr.labels) ? pr.labels.map((l) => (l ? l.name : null)) : [];
              // Both protected bases accept the two narrow exceptions (3.8), but only with a maintainer grant.
              if (isExempt(pr, labels, parseGrants(cfg.exemptions))) return ignore('exempt-label');

              const isTrainPr =
                baseRef === cfg.baseBranch &&
                pr.head.ref === RELEASE_NEXT &&
                sameRepo(pr.head.repo, pr.base.repo) &&
                !!pr.user &&
                pr.user.type === 'Bot' &&
                pr.user.login === cfg.botLogin;
              if (isTrainPr) return ignore('train-pr');

              return {
                action: 'close',
                reason: baseRef === RELEASE_NEXT ? 'base-release-next' : 'base-protected',
                comment: buildComment({ number: pr.number, baseRef, headRef: pr.head.ref, baseBranch: cfg.baseBranch }),
              };
            }

            function buildComment(info) {
              const head = safeRef(info.headRef);
              const topic = head !== null && /^t\/[A-Za-z0-9][A-Za-z0-9._-]*\/[A-Za-z0-9][A-Za-z0-9._-]*$/.test(head) ? head : null;
              const ticketMatch = topic ? /^t\/[^/]+\/(q-\d+)(?![0-9])/i.exec(topic) : null;
              const ticket = ticketMatch ? ticketMatch[1].toUpperCase() : '<ticket>';
              const topicRef = topic || 't/<agent>/<ticket>-<slug>';
              const why =
                info.baseRef === RELEASE_NEXT
                  ? '`release/next` is owned by the release-train bot; nobody opens PRs into it.'
                  : '`' + info.baseBranch + '` only accepts the single release-train PR (`release/next` -> `' + info.baseBranch + '`).';
              const lines = [
                '<!-- train-guard -->',
                'Closing this PR automatically. ' + why,
                '',
                'To get this work released, go through the train:',
                '',
                '1. Push your work to a topic branch named `' + topicRef + '`' + (topic ? ' (already done).' : '.'),
                '2. Claim the ticket on the pinned `train-control` issue (or on the active train PR):',
                '   `/train claim ' + ticket + '`  (CLI: `train claim ' + ticket + '`)',
                '3. Land the topic into the next release:',
                '   `/train land <claim-id> ' + topicRef + '`  (CLI: `train land <claim-id> ' + topicRef + '`)',
                '',
                'The controller replies with your claim id. Maintainers can grant a narrow exception with the label ' +
                  '`train-exempt:dependabot` or `train-exempt:security` plus a maintainer grant in the guard configuration (then reopen this PR).',
              ];
              return lines.join('\n');
            }
            // <<< END guard-logic

            const cfg = {
              baseBranch: process.env.TRAIN_BASE_BRANCH,
              botLogin: process.env.TRAIN_BOT_LOGIN,
              // Maintainer grants (JSON list of {repo, pr, label}); unset or malformed grants nothing.
              exemptions: parseGrants(process.env.TRAIN_EXEMPTIONS),
            };
            if (!cfg.baseBranch || !cfg.botLogin) {
              core.setFailed('train-guard is not configured (TRAIN_BASE_BRANCH / TRAIN_BOT_LOGIN)');
              return;
            }
            const decision = decideGuard(context.payload, cfg);
            core.info('train-guard: ' + decision.action + ' (' + decision.reason + ')');
            if (decision.action !== 'close') return;

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            // Enforcement first: the close is what matters; the comment is best effort.
            await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });
            try {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: decision.comment });
            } catch (err) {
              core.warning('could not comment on PR #' + number + ': ' + (err && err.message));
            }
